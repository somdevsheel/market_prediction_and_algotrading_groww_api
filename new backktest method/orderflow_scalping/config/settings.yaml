# Order-flow scalping research engine — global settings. Historical research / paper simulation ONLY.
data:
  mode: proxy                      # proxy = 1-minute futures OHLCV (no historical L2/tick data exists from Groww)
  instrument: NIFTY near-month futures (continuous, intraday only -> no roll gaps)
  interval: 1minute
  start: "2020-01-01"
  end: "2026-11-06"
  index_source: main project data_lake (read-only)
lot_size_schedule:                 # same schedule as the main project (VERIFY earlier entries)
  - {from: "2020-01-01", lot_size: 75}
  - {from: "2021-07-30", lot_size: 50}
  - {from: "2024-04-26", lot_size: 25}
  - {from: "2024-11-20", lot_size: 75}
  - {from: "2025-12-30", lot_size: 65}
lots: 1                            # fixed; never increased after losses
session:
  first_entry: "09:20"             # skip the opening auction / first 5 minutes
  last_entry: "15:00"
  square_off: "15:20"
execution:
  order_type: market               # market | limit
  latency_bars: 1                  # decision at bar close t, earliest fill = open of bar t+1
  limit_ttl_bars: 3                # limit orders live this many bars, then cancelled (non-fill)
  limit_trade_through_ticks: 1     # a limit fills only if price trades THROUGH it by >= 1 tick (queue unknown)
  tick: 0.05
scenarios:                         # futures spread + slippage per side, in index points (assumptions, not data)
  optimistic:   {half_spread: 0.25, slippage: 0.25}
  base:         {half_spread: 0.50, slippage: 0.50}
  conservative: {half_spread: 1.00, slippage: 1.00}
costs:                             # NIFTY futures (Groww + statutory). VERIFY current rates.
  brokerage_per_order: 20.0
  stt_sell_pct: 0.02               # on sell-side notional (futures)
  exchange_txn_pct: 0.00173        # NSE futures, on turnover
  sebi_pct: 0.0001
  stamp_buy_pct: 0.002
  ipft_pct: 0.001                  # Rs 1 per lakh
  gst_pct: 18.0                    # on brokerage + exchange + SEBI + IPFT
risk:
  capital: 200000                  # one NIFTY futures lot needs roughly Rs 1.2-1.6 L margin
  max_open_positions: 1
  stop_atr_mult: 1.5               # volatility-adjusted stop (ATR of 1-minute bars)
  target_atr_mult: 2.0
  max_holding_bars: 30
  max_trades_per_day: 20
  daily_loss_limit: 5000
  max_consecutive_losses: 5        # shut down for the day after this many losses in a row
validation:
  train_end: "2023-12-31"          # train 2020-2023, out-of-sample test 2024 -> end
  wf_train_months: 12
  wf_test_months: 3
  min_trades: 100
  bootstrap_runs: 2000
