# Strategy registry + governance. Changing params/filters of a strategy REQUIRES bumping its version
# (live approval is tied to the config hash). Retired/unprofitable strategies: archive/config/strategies_retired.yaml
# status: RESEARCH | BACKTESTED | OUT_OF_SAMPLE_VALIDATED | PAPER_TRADING | APPROVED_FOR_LIVE | RETIRED
active_strategy: orb_retest30_cheapiv_v1

strategies:
  orb_retest30_cheapiv_v1:
    class: orb
    # 2026-11-09 backtest 2021-01-01..2026-11-06, real 1-minute option candles, Rs 20k / Rs 1,000 cap, 15:15 exit:
    # 277 trades, net +44,810 (conservative costs), PF 1.23, maxDD -22,802; lost in 2024 and 2025.
    # Found after testing several variants (selection bias) -> must prove itself in paper/live with 1 lot.
    # Reproduce: python3 scripts/backtest_strategy.py
    status: BACKTESTED
    version: "1.0.0"
    description: 30-min ORB retest (range <= 0.5%, retest within 60 min) taken only when option IV <= GARCH forecast.
    params: {mode: retest, or_minutes: 30, orb_filters: {max_range_pct: 0.5, max_gap_minutes: 60}}
    filters: {contract_iv_max_over_rv: 1.0, rv_forecast_feature: garch_fc}
    risk_overrides: {reward_risk: 50}
