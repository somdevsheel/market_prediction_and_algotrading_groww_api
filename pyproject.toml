[project]
name = "nifty-quant-system"
version = "0.1.0"
description = "Research-driven, risk-controlled NIFTY options trading platform (Groww)"
requires-python = ">=3.10"
dependencies = [
  "growwapi==1.5.0", "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "pyarrow>=15", "duckdb>=1.0",
  "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "requests>=2.31", "pyotp>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
